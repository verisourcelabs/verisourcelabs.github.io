<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CAC Co-Pilot · Mode A</title>
  <style>
    :root {
      --bg: #0e1412;
      --panel: #17211d;
      --ink: #e7f0ea;
      --muted: #8aa396;
      --line: #2a3b34;
      --accent: #3dba8b;
      --warn: #e0b25a;
      --block: #d4655a;
      --cloud: #6ea8ff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font: 14px/1.45 "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--ink);
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 16px 22px;
      border-bottom: 1px solid var(--line);
    }
    header strong { color: var(--accent); letter-spacing: 0.04em; }
    header span { color: var(--muted); font-size: 12px; }
    main {
      display: grid;
      grid-template-columns: 280px 1fr 320px;
      min-height: calc(100vh - 56px);
    }
    aside, section, article {
      padding: 16px;
      border-right: 1px solid var(--line);
    }
    article { border-right: 0; }
    h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 0 0 12px; }
    .case {
      display: block;
      width: 100%;
      text-align: left;
      background: var(--panel);
      color: var(--ink);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px;
      margin: 0 0 8px;
      cursor: pointer;
    }
    .case.active { border-color: var(--accent); }
    .case b { display: block; margin-bottom: 4px; }
    .hint { font-size: 11px; color: var(--muted); }
    .pill {
      display: inline-block;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 999px;
      border: 1px solid var(--line);
      margin-right: 6px;
    }
    .LOCAL_HARD_BLOCK { color: var(--block); }
    .LOCAL_CDI_QUERY_DRAFT { color: var(--warn); }
    .CLOUD_ARBITRATION { color: var(--cloud); }
    .LOCAL_ACCEPT_QUEUE { color: var(--accent); }
    pre {
      background: #0a100e;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px;
      overflow: auto;
      font-size: 12px;
    }
    button.run, button.decide {
      background: var(--accent);
      color: #062117;
      border: 0;
      border-radius: 8px;
      padding: 8px 12px;
      font-weight: 650;
      cursor: pointer;
      margin: 8px 8px 8px 0;
    }
    button.decide { background: #c9d6cf; }
    select, input {
      background: var(--panel);
      color: var(--ink);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 6px 8px;
      margin: 4px 8px 8px 0;
    }
    .quote { border-left: 3px solid var(--accent); padding: 6px 10px; margin: 8px 0; color: #d5e6dc; }
    #status { color: var(--muted); font-size: 12px; }

    /* Pretty Print Result Card Styles */
    .result-placeholder {
      background: #0a100e;
      border: 1px dashed var(--line);
      border-radius: 8px;
      padding: 18px 14px;
      color: var(--muted);
      font-size: 13px;
      text-align: center;
      margin-bottom: 12px;
      line-height: 1.5;
    }
    .result-card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px;
      margin-bottom: 12px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
    }
    .tier-banner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      border-radius: 6px;
      margin-bottom: 12px;
      font-weight: 600;
    }
    .tier-banner.LOCAL_ACCEPT_QUEUE {
      background: rgba(61, 186, 139, 0.12);
      border: 1px solid var(--accent);
      color: var(--accent);
    }
    .tier-banner.LOCAL_HARD_BLOCK {
      background: rgba(212, 101, 90, 0.12);
      border: 1px solid var(--block);
      color: var(--block);
    }
    .tier-banner.LOCAL_CDI_QUERY_DRAFT {
      background: rgba(224, 178, 90, 0.12);
      border: 1px solid var(--warn);
      color: var(--warn);
    }
    .tier-banner.CLOUD_ARBITRATION {
      background: rgba(110, 168, 255, 0.12);
      border: 1px solid var(--cloud);
      color: var(--cloud);
    }
    .meta-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(115px, 1fr));
      gap: 8px;
      margin-bottom: 12px;
    }
    .meta-item {
      background: #0a100e;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 8px 10px;
    }
    .meta-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      margin-bottom: 3px;
    }
    .meta-val {
      font-size: 12px;
      font-weight: 600;
      font-family: "JetBrains Mono", Consolas, monospace;
    }
    .code-tag {
      display: inline-block;
      background: #1e2c26;
      color: #92e0be;
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 2px 7px;
      font-family: "JetBrains Mono", Consolas, monospace;
      font-size: 12px;
      font-weight: 600;
      margin: 2px 4px 2px 0;
    }
    .log-item {
      font-size: 12px;
      padding: 4px 0;
      display: flex;
      gap: 8px;
      color: #d5e6dc;
      line-height: 1.4;
    }
    .log-bullet {
      color: var(--accent);
      font-weight: bold;
      flex-shrink: 0;
    }
    .callout-box {
      margin-top: 10px;
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 12px;
      line-height: 1.45;
    }
    .callout-query {
      background: rgba(224, 178, 90, 0.08);
      border-left: 3px solid var(--warn);
      color: #f3dfb2;
    }
    .callout-critic {
      background: rgba(110, 168, 255, 0.08);
      border-left: 3px solid var(--cloud);
      color: #d0e2ff;

      margin-top: 12px;
      border-top: 1px solid var(--line);
      padding-top: 8px;
    }

      font-size: 11px;
      color: var(--muted);

    }

    }
    details.raw-json pre {
      margin-top: 8px;
      font-size: 11px;
      max-height: 200px;
    }
  </style>
</head>

    async function jget(url) {
      try {
        const r = await fetch(url);
        if (r.ok) return await r.json();
      } catch (e) {}

      if (url === "/v1/me") {
        return { ok: true, seat: { email: "demo@verisourcelabs.com", plan: "enterprise", tenant: "synthetic-health" } };
      }
      if (url === "/v1/cases") {
        return {
          ok: true,
          cases: Object.values(STATIC_CASES).map((c) => ({
            case_id: c.case_id,
            title: c.title,
            plan_hint: c.plan_hint,
          })),
        };
      }
      if (url.startsWith("/v1/cases/")) {
        const id = url.replace("/v1/cases/", "");
        return STATIC_CASES[id] || { ok: false, reason: "Case not found" };
      }
      if (url === "/v1/audit") {
        return { ok: true, rows: window._staticAudit || [] };
      }
      return { ok: false, reason: "unavailable" };
    }

    async function jpost(url, body) {
      try {
        const r = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: body ? JSON.stringify(body) : "{}",
        });
        if (r.ok) return await r.json();
      } catch (e) {}

      window._staticAudit = window._staticAudit || [];
      if (url.startsWith("/v1/cases/") && url.endsWith("/run")) {
        const id = url.split("/")[3];
        const c = (STATIC_CASES && STATIC_CASES[id]) || {};
        const req_id = "REQ_" + id + "_" + Math.random().toString(36).substring(2, 8);
        const action = c.action || c.plan_hint || "LOCAL_ACCEPT_QUEUE";
        const cloud_usd = action === "CLOUD_ARBITRATION" ? 0.0024 : 0.0;
        let vlogs = [];
        let cdiQuery = null;
        let criticData = null;

        if (action === "LOCAL_HARD_BLOCK") {
          vlogs = [
            "NCCI PTP Policy Edit: Prohibited procedure combination under indicator 0.",
            "Hard block enforced for candidate codes: " + (c.candidates || []).join(", "),
            "Zero cloud inference cost incurred (evaluated locally via deterministic SQL)."
          ];
        } else if (action === "LOCAL_CDI_QUERY_DRAFT") {
          vlogs = [
            "Clinical Documentation Deficiency detected in encounter note.",
            "Statutory code set requires provider clarification prior to billing commitment."
          ];
          cdiQuery = "Physician Query: Encounter note requires anatomical laterality or relationship clarification within the global period before code set commitment.";
        } else if (action === "CLOUD_ARBITRATION") {
          vlogs = [
            "Contested surgical window or complex Excludes1 pairing detected.",
            "Encounter safely routed to Gemini Clinical Critic with bounded quote spans."
          ];
          criticData = {
            verdict: "UNRELATED_SUPPORTED",
            confidence: 0.94,
            reasoning: "Clinical documentation details an independent anatomical site and new-onset complaint separate from the index procedure."
          };
        } else {
          vlogs = [
            "All statutory NCCI, MUE, and ICD-10-CM codebook rules satisfied.",
            "Case validated and queued for local certified coder sign-off."
          ];
        }

        const out = {
          ok: true,
          action: action,
          request_id: req_id,
          case_id: id,
          candidates: c.candidates || [],
          cloud_usd: cloud_usd,
          validation_logs: vlogs,
          cdi_query: cdiQuery,
          critic: criticData,
          timestamp: new Date().toISOString(),
        };
        window._staticAudit.unshift({
          request_id: req_id,
          action: action,
          candidates: c.candidates || [],
          override_code: null,
          cloud_usd: cloud_usd,
        });
        return out;
      }
      if (url.startsWith("/v1/work/") && url.endsWith("/decision")) {
        const req_id = url.split("/")[3];
        const found = window._staticAudit.find((r) => r.request_id === req_id);
        const code = (body && body.override_code) || "AGREE_AS_IS";
        if (found) found.override_code = code;
        return { ok: true, request_id: req_id, override_code: code };
      }
      return { ok: false, reason: "unavailable" };
    }

        function renderTriageResult(out) {
      if (!out || !out.ok) {
        return `<div class="result-placeholder" style="border-color:var(--block);color:var(--block);">
          <b>✕ Evaluation Failed</b>
          <div class="hint" style="margin-top:4px;">${out && out.reason ? out.reason : "Unknown error encountered"}</div>
        </div>`;
      }

      const action = out.action || "UNKNOWN";
      let bannerTitle = action;
      let bannerDesc = "";

      if (action === "LOCAL_HARD_BLOCK") {
        bannerTitle = "🛑 Statutory Hard-Block Enforced";
        bannerDesc = "Deterministic NCCI / Codebook rule prohibits combination. Code dropped.";
      } else if (action === "LOCAL_ACCEPT_QUEUE") {
        bannerTitle = "✓ Validation Passed";
        bannerDesc = "Statutory rules satisfied. Case staged for certified coder sign-off.";
      } else if (action === "LOCAL_CDI_QUERY_DRAFT") {
        bannerTitle = "📝 CDI Query Drafted";
        bannerDesc = "Documentation deficiency detected. Non-leading physician query generated.";
      } else if (action === "CLOUD_ARBITRATION") {
        bannerTitle = "☁️ Cloud Arbitration Routed";
        bannerDesc = "Contested rule safely routed to Gemini Clinical Critic with bounded quote spans.";
      }

      const candidates = out.candidates || [];
      const candidatesHtml = candidates.length > 0
        ? candidates.map(c => `<span class="code-tag">${c}</span>`).join("")
        : `<span class="hint">None</span>`;

      const logs = out.validation_logs || out.log_messages || [];
      const logsHtml = logs.length > 0
        ? logs.map(l => `
            <div class="log-item">
              <span class="log-bullet">›</span>
              <span>${l}</span>
            </div>`).join("")
        : `<div class="hint">No statutory rules violated.</div>`;

      const cdiQuery = out.cdi_query;
      let queryHtml = "";
      if (cdiQuery) {
        queryHtml = `
          <div class="callout-box callout-query">
            <div style="font-weight:700;color:var(--warn);margin-bottom:4px;display:flex;align-items:center;gap:6px;">
              <span>📝 Drafted Non-Leading Physician Query</span>
            </div>
            <div style="font-style:italic;">"${cdiQuery.replace(/^Physician Query:\s*/, "")}"</div>
          </div>`;
      }

      const critic = out.critic || out.critic_data;
      let criticHtml = "";
      if (critic) {
        criticHtml = `
          <div class="callout-box callout-critic">
            <div style="font-weight:700;color:var(--cloud);margin-bottom:4px;display:flex;align-items:center;justify-content:space-between;">
              <span>⚡ Gemini Clinical Critic Analysis</span>
              <span class="pill CLOUD_ARBITRATION" style="font-size:10px;">Confidence ${Math.round((critic.confidence || 0.94) * 100)}%</span>
            </div>
            <div style="margin-bottom:4px;"><b>Verdict:</b> ${critic.verdict || "SUPPORTED"} · <b>Parallel Judge:</b> PASS</div>
            <div class="hint" style="color:#b8d5ff;">${critic.reasoning || "Clinical documentation supports separately identifiable service."}</div>
          </div>`;
      }

      const rawJson = JSON.stringify(out, null, 2);

      return `
        <div class="result-card">
          <div class="tier-banner ${action}">
            <div>
              <div style="font-size:14px;letter-spacing:-0.01em;">${bannerTitle}</div>
              <div style="font-size:11px;font-weight:normal;opacity:0.9;margin-top:2px;">${bannerDesc}</div>
            </div>
            <span class="pill ${action}">${action}</span>
          </div>

          <div class="meta-grid">
            <div class="meta-item">
              <div class="meta-label">Candidate Codes</div>
              <div class="meta-val">${candidatesHtml}</div>
            </div>
            <div class="meta-item">
              <div class="meta-label">Cloud Spend</div>
              <div class="meta-val" style="color:${Number(out.cloud_usd || 0) > 0 ? 'var(--cloud)' : 'var(--accent)'}">
                $${Number(out.cloud_usd || 0).toFixed(6)}
              </div>
            </div>
            <div class="meta-item">
              <div class="meta-label">Request ID</div>
              <div class="meta-val" style="font-size:10px;color:var(--muted);font-weight:normal;">${(out.request_id || "").slice(0, 18)}…</div>
            </div>
          </div>

          <div style="font-size:10px;text-transform:uppercase;letter-spacing:0.06em;color:var(--muted);margin:10px 0 4px;font-weight:600;">
            Pipeline Validation Audit
          </div>
          <div style="background:#0a100e;border:1px solid var(--line);border-radius:6px;padding:8px 10px;">
            ${logsHtml}
          </div>

          ${queryHtml}
          ${criticHtml}

          <details class="raw-json">
            <summary>View raw JSON payload</summary>
            <pre>${rawJson}</pre>
          </details>
        </div>
      `;
    }

    async function boot() {
      const me = await jget("/v1/me");
      $("who").textContent = me.ok
        ? `${me.seat.email} · ${me.seat.plan} · ${me.seat.tenant}`
        : (me.reason || "no seat");
      const list = await jget("/v1/cases");
      $("cases").innerHTML = (list.cases || []).map((c) =>
        `<button class="case" data-id="${c.case_id}"><b>${c.title}</b><span class="hint">${c.plan_hint}</span></button>`
      ).join("");
      document.querySelectorAll(".case").forEach((btn) => {
        btn.addEventListener("click", () => openCase(btn.dataset.id, btn));
      });
      if (list.cases && list.cases.length > 0) {
        const firstBtn = document.querySelector(".case");
        openCase(list.cases[0].case_id, firstBtn);
      }
      refreshAudit();
    }

    async function openCase(id, btn) {
      document.querySelectorAll(".case").forEach((b) => b.classList.remove("active"));
      if (btn) btn.classList.add("active");
      const data = await jget("/v1/cases/" + id);
      current = data.case_id;
      lastReq = null;
      $("meta").innerHTML =
        `<div><b>${data.title}</b></div>
         <div class="hint">${data.blurb}</div>
         <div style="margin-top:8px">
           <span class="pill">${data.setting}</span>
           <span class="pill ${data.plan_hint}">${data.plan_hint}</span>
         </div>`;
      $("quotes").innerHTML = (data.quotes || []).map((q) =>
        `<div class="quote"><code>${q.span_id}</code> — ${q.text}</div>`
      ).join("");
      $("result").innerHTML = `
        <div class="result-placeholder">
          Case <b>${data.title}</b> selected.<br>
          <span class="hint">Click <b>Run triage</b> to evaluate statutory NCCI and codebook rules.</span>
        </div>
      `;
    }

    $("run").addEventListener("click", async () => {
      if (!current) return;
      $("status").textContent = "evaluating…";
      $("result").innerHTML = `
        <div class="result-placeholder" style="color:var(--accent);">
          Evaluating statutory rules and policy edits for <b>${current}</b>…
        </div>
      `;
      const out = await jpost("/v1/cases/" + current + "/run");
      $("status").textContent = out.ok ? out.action : (out.reason || "error");
      lastReq = out.request_id;
      $("result").innerHTML = renderTriageResult(out);
      refreshAudit();
    });

    $("decide").addEventListener("click", async () => {
      if (!lastReq) return;
      const out = await jpost("/v1/work/" + lastReq + "/decision", {
        override_code: $("override").value,
        note: $("note").value,
      });
      $("status").textContent = out.ok ? out.override_code : (out.reason || "error");
      refreshAudit();
    });

    async function refreshAudit() {
      const out = await jget("/v1/audit");
      const rows = (out.rows || []).map((r) =>
        `${r.request_id.slice(0, 18)}…  ${r.action}  ${(r.candidates || []).join(",") || "[]"}  ${r.override_code || "open"}  $${Number(r.cloud_usd || 0).toFixed(6)}`
      );
      $("audit").textContent = rows.join("\n") || "empty";
    }

    boot();
  </script>
</body>
</html>
